version: '3.8'

services:
  dissectx:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dissectx_production_secret_key
      - SCANS_DIR=/root/.dissectx_scans
    volumes:
      - dissectx_scans:/root/.dissectx_scans
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  dissectx_scans:
  redis_data:
